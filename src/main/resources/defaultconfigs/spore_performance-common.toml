# Spore Performance 1.20.1 - 服务端/通用配置。
# [safe] 为语义等价的安全优化；[aggressive] 每个功能独立选择开启，可能改变后台完成时间。
[safe]
# 感染刷怪笼的供养扫描只在服务端运行。
spawnerServerOnly = true
# 预编译方块感染映射，移除热路径中的字符串解析。
compiledInfectionMap = true
# 优化感染卷须的局部传播，不改变原有节奏、概率或交互结果。
tendrilSpreadFastPath = true
# 同一灾厄实体在同一 Tick 最多一次路径重算。
sameTickPathGate = true
# 跳过非进化感染体必定无结果的灾厄伙伴搜索。
skipNonEvolvingCalamityFollow = true
# 复用 AI Fix Howitzer 在同 Tick、同目标位置的视线判断。
howitzerSameTickCache = true
# sporesrp 按维度分桶，并跳过无效跨维 UUID 查找。
sporesrpDimensionGuards = true
# sporesrp 已关闭的 Handler 立即返回，不建立无用缓存。
sporesrpDisabledShortCircuit = true
# Sona 的区块感染总开关判定在同一维度同一 Tick 内复用；不缓存感染数值。
sonaCanChunkInfectionTickCache = true
# 同 Tick同区块的 Spore 投射物共享宽相候选，最终碰撞仍逐投射物精确判定。
sporeProjectileBroadphaseCache = true
# 保存胆汁投射物已存活时间，避免区块卸载后重新计时并遗留远距投射物。
persistBileProjectileLifetime = true
# 胆汁投射物的总生存时间（Tick）；300 与 Spore 本体原始设定一致。
bileProjectileLifetimeTicks = 300

[refactor]

[refactor.ai]
# 启用 Spore 实体 AI 底层重构总开关；关闭后公共入口回退原逻辑。
enabled = true
# 同一空间单元共享一次目标候选感知帧。
sharedPerception = true
# 受击和目标变化通过事件驱动威胁网络传播。
eventDrivenThreats = true
# 使用维度级群组成员表处理目标传播和伙伴选择。
groupCoordination = true
# 启用即时、感知、导航和后台四阶段 Tick 诊断。
tickPipeline = true

[refactor.navigation]
# 启用 Spore 共享导航服务；移动和碰撞仍逐 Tick。
enabled = true
# 相近体型、起点和目标区段允许共享路径走廊。
sharedCorridors = true
# 长距离路径使用主线程只读快照和后台粗粒度求解。
asyncLongPaths = true
# 超过此距离才创建异步路径任务（格）。
asyncThreshold = 12
# 异步路径工作线程数量。
workerThreads = 2
# 每个维度每 Tick 最多复制的路径快照数量。
snapshotBudgetPerTick = 32
# 每个维度每 Tick 最多应用的路径结果数量。
resultBudgetPerTick = 64
# 单个维度异步路径请求队列上限。
queueLimit = 256
# 单个维度共享路径缓存上限。
cacheEntries = 2048
# 共享路径最大有效时间（Tick）。
cacheTicks = 40
# 目标移动超过此距离后路径失效（格）。
targetMoveInvalidation = 2.0

[refactor.compat]
# 检测 AI Fix 时避开其灾厄专属技能覆盖。
sporeAiFix = true
# 为 sporesrp Proto 和器官体启用软兼容适配。
sporesrp = true

[refactor.calamityNavigation]
# 启用全灾厄导航运行时；仅调度寻路和朝向，不替换攻击、技能或移动物理。
enabled = true
# 非技能状态下只允许移动执行器写入灾厄身体朝向，观察控制仅处理头部、视线和俯仰。
singleYawOwner = true
# 检测路径节点无进展并按重算、替代落点和退避顺序恢复，避免原地持续转圈。
progressRecovery = true
# 缓存灾厄前往固定 SearchArea 的坐标路径；实体目标和坐标目标使用独立缓存键。
positionPathCache = true
# 方块变更只使经过该区段的路径失效，不再让整维度全部路径缓存失效。
sectionPathInvalidation = true
# 路径节点连续未推进且位移过低多少 Tick 后判定为卡路。
noProgressTicks = 20
# 第二次卡路时为固定目标选择替代落点的最大半径（格）。
recoveryWaypointRadius = 4
# 首次导航退避时间（Tick）；后续按 20、40、80 Tick 递增。
retryTicks = 20
# 灾厄导航退避的最大时间（Tick）。
maxRetryTicks = 80
# 完全排除朽翼魔龙（Verfalldrachen），不改变其盘旋、寻路或技能逻辑。
excludeVerfalldrachen = true

[refactor.multipart]
# 为 HohlMultipart 使用轻量服务端 Tick；保留命中箱、伤害转发、父实体同步和死亡逻辑。
minimalServerTick = true
# 让 HohlMultipart 近战分体共享已加载实体索引；最终范围、阵营和伤害判定仍逐分体执行。
sharedMeleeQuery = true

[refactor.staticEntities]
# 菌丘没有目标或受击时跳过移动和完整 AI，只保留年龄、感染周期和同步。
moundMinimalTick = true
# 扎根且未战斗的 GastGeber 跳过移动和无效 AI；脱根、受击或获得目标立即恢复。
rootedGastgeberMinimalTick = true
# 在实体进入服务端 AI 前检查工作令牌，避免未取得后台名额的旧实体运行完整 Goal。
enforceWorkTokensBeforeAi = true

[refactor.follow]
# 用维度级伙伴群组和共享走廊替代每个感染体重复创建跟随路径。
groupPathing = true
# 伙伴跟随抵达半径按双方碰撞箱计算，避免大型单位在近距离反复寻路。
sizeAwareArrival = true
# 伙伴距离不超过此值且局部路线安全时直接移动，不创建 Path。
directSteeringDistance = 12
# 每个伙伴群组每 Tick最多创建的本地接入路径数。
maxLocalPathsPerGroupTick = 1

[refactor.busser]
# 启用 Busser 变体行动仲裁和飞行导航碰撞缓存。
enabled = true
# 按 Busser 变体只运行匹配的 Goal，减少互斥 Goal 的重复 canUse。
variantGoalPruning = true
# 同一飞行导航 Tick复用碰撞区域和方块状态，避免重复创建 PathNavigationRegion。
sharedAirSweepContext = true
# Busser 飞行导航每 Tick最多测试的捷径候选数量。
shortcutCandidatesPerTick = 3
# Busser 飞行捷径碰撞结果的最短刷新间隔。
shortcutRefreshTicks = 2

[refactor.foliage]
# 菌丘侵蚀只读取实际触发分支需要的邻居方块。
lazyNeighborReads = true
# 预编译菌丘感染映射、标签和方块属性处理计划。
compiledActionPlans = true
# 菌丘侵蚀重构的全局 Tick耗时预算（微秒）。
foliageTimeBudgetMicros = 750
# 感染卷须重构的全局 Tick耗时预算（微秒）。
tendrilTimeBudgetMicros = 350

[compat]

[compat.touhouLittleMaid]
# 女仆 P 点软兼容：共享附近玩家查询并降低无人静止 P 点物理频率，不合并或改变 P 点价值。
powerPointOptimization = true
# 无人接近且落地静止 P 点的完整物理检查间隔（Tick）。
groundedPhysicsInterval = 4

[limits]
# 上限按“单维度已加载实体”统计。0 表示不限制；已有存档实体不会被删除或阻止读档。
# 所有 Spore Mob 生物单位总数上限。
maxFungalUnitsPerDimension = 200
# 菌囊/菌丘（spore:mound）上限。
maxMoundsPerDimension = 16
# 感染卷须（spore:tendril）上限；Boss 的 arena_tendril 不计入。
maxTendrilsPerDimension = 32

[limits.calamity]
# 单个维度内所有灾厄实体总数上限；-1 表示不限制；存档已有灾厄仍允许加载。
maxTotal = -1
# 单个维度内同一种灾厄实体上限；-1 表示不限制；存档已有灾厄仍允许加载。
maxPerType = -1

[limits.working]
# 同时执行完整 AI 的 Spore 生物单位数；超额旧实体保留并休眠。
maxActiveFungalUnitsPerDimension = 200
# 同时执行感染传播工作的 GastGeber 数量。
maxWorkingGastGebersPerDimension = 12
# 同时执行感染和卷须任务的 Mound 数量。
maxWorkingMoundsPerDimension = 8
# 同时执行方块传播的感染卷须数量。
maxWorkingTendrilsPerDimension = 16
# 后台工作名额重新排序和轮换的周期（Tick）。
rotationTicks = 200
# 实体获得工作名额后的最短保持时间（Tick）。
hysteresisTicks = 40

[items]

[items.merge]
# 启用 SporePerformance 自带的 Spore 掉落物区块分桶合并；Harium/Lithium 已提供合并优化时建议保持关闭。
enabled = false
# 把批量合并应用到所有模组物品；默认关闭。
global = false
# 受管物品合并半径（格）。
radius = 4
# 物品合并协调器运行间隔（Tick）。
intervalTicks = 10
# 单个维度每轮最多检查的物品实体数。
entityBudget = 256
# 单个维度每轮物品合并耗时预算（微秒）。
timeBudgetMicros = 750

[items.lifetime]
# 缩短受管 Spore 普通掉落物的自然消失时间。
enabled = true
# 常见 Spore 废料自然消失时间（Tick）；1200 Tick 为60秒。
fastTicks = 1200
# 其他 Spore 普通掉落物自然消失时间（Tick）；2400 Tick 为120秒。
normalTicks = 2400
# 玩家主动丢弃物品保护时间（Tick）；6000 Tick 为原版5分钟。
playerDroppedTicks = 6000
# 保护不可堆叠、命名、附魔、损伤或带自定义NBT的物品。
protectSpecialItems = true

[aggressive]
# 将菌囊的大范围卷须目标搜索拆分到多个 Tick；会延后找到目标的时间。
moundTendrilScheduler = false
# 单个卷须搜索任务每 Tick 最多检查的方块数。
tendrilBlocksPerTaskTick = 4096
# 所有卷须搜索任务每 Tick 共用的方块预算。
tendrilBlocksGlobalTick = 16384
# 可同时排队的卷须搜索任务上限；满时请求延后重试。
maxTendrilJobs = 64
# 将菌囊侵蚀、菌丝和结构生成拆分到多个 Tick；会延长后台完成时间。
foliageScheduler = false
# 单个菌囊侵蚀任务每 Tick 最多处理的方块数。
foliageBlocksPerTaskTick = 2048
# 所有菌囊侵蚀任务每 Tick 共用的方块预算。
foliageBlocksGlobalTick = 8192
# 可同时排队的菌囊侵蚀任务上限。
maxFoliageJobs = 128
# 使用低分配整数游标，并在读取世界前排除球体外位置。
foliageFastCursor = false
# 按当前区块复用已经加载的 LevelChunk；不会请求或加载新区块。
foliageDirectLoadedChunkRead = false
# 为菌囊侵蚀任务增加真实耗时上限。
foliageTimeBudget = false
# 全部菌囊侵蚀任务单 Tick 共用的时间预算，单位微秒。
foliageTimeBudgetMicros = 1500
# 为菌囊卷须目标搜索增加真实耗时上限。
tendrilTimeBudget = false
# 全部菌囊卷须搜索任务单 Tick 共用的时间预算，单位微秒。
tendrilTimeBudgetMicros = 500
# 不可达目标时让灾厄寻路按退避间隔重试。
calamityPathBackoff = false
# 灾厄路径重算的最小间隔（Tick）；仅在上一项开启时生效。
calamityPathMinIntervalTicks = 10
# 将 Spore 无目标实体的目标获取按距离错峰到2至5 Tick。
balancedTargetAcquisition = true
# 使用近距离目标检查间隔的范围（格）。
targetNearDistance = 16
# 近距离无目标实体目标检查间隔（Tick）。
targetNearIntervalTicks = 2
# 远距离无目标实体目标检查间隔（Tick）。
targetFarIntervalTicks = 5
# 为普通感染体、进化体、Hyper和器官体启用路径复用及失败退避。
generalPathBackoff = true
# 目标移动超过此距离时立即解除路径等待（格）。
pathTargetMoveThreshold = 2.0
# 普通 Spore 寻路失败后的最大退避时间（Tick）。
pathBackoffMaxTicks = 80
# 降低远离玩家且静止落地物品的碰撞查询频率。
stationaryItemPhysicsLod = false
# 静止物品执行完整物理的间隔（Tick）。
stationaryItemPhysicsInterval = 4
# 玩家进入此距离后恢复物品逐 Tick物理（格）。
stationaryItemWakeDistance = 8
# 清理超过寿命且所有者已失效的 Spore 投射物。
orphanProjectileCleanup = false
# 孤立 Spore 投射物允许存在的最长时间（Tick）。
orphanProjectileLifetimeTicks = 600
# 远离玩家且空闲的 Basic/Evolved/Hyper 感染体降低 Goal/TargetSelector 更新频率。
remoteIdleAi = false
# 距最近玩家超过此距离才允许远距空闲 AI 降频。
remoteIdleAiDistance = 96
# 远距空闲 AI 的选择器更新间隔（Tick）；物理、生命和同步仍逐 Tick。
remoteIdleAiInterval = 10
# 缓存 AI Fix Howitzer 的轨迹计算，并限制每 Tick 新轨迹数量。
howitzerTrajectoryCache = false
# Howitzer 轨迹缓存的有效 Tick 数；目标移动超过 1.5 格会提前失效。
howitzerTrajectoryCacheTicks = 5
# 每个 Howitzer 每 Tick 最多允许的新轨迹探测数；命中缓存不消耗预算。
howitzerMaxNewTrajectoriesPerTick = 8
# 同一目标的感染体群体感知共享邻居查询，并错峰伙伴跟随搜索。
groupSensingCache = false
# 伙伴跟随候选快照的有效期（Tick）；仅在 groupSensingCache 开启时生效。
followSnapshotTicks = 20
# 伙伴没有明显移动且现有路径有效时复用路径，并将周期重算按 UUID 错峰。
