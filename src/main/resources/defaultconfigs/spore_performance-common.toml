# 伙伴跟随路径的最短周期重算间隔（Tick）。
followRepathIntervalTicks = 40
# 伙伴移动超过此距离时允许提前重算路径。
followRepathMoveThreshold = 2.0
# 伙伴寻路失败后按递增间隔重试。
followPathFailureBackoff = false
# 伙伴寻路失败的最大退避时间（Tick）。
